name: Release

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PLUGIN_NAME: filoucrackeur/docker-deps

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Build Binaries
        run: |
          mkdir dist
          GOOS=linux GOARCH=amd64 go build -o dist/docker-deps-linux-amd64
          GOOS=darwin GOARCH=amd64 go build -o dist/docker-deps-darwin-amd64
          GOOS=darwin GOARCH=arm64 go build -o dist/docker-deps-darwin-arm64
          GOOS=windows GOARCH=amd64 go build -o dist/docker-deps-windows-amd64.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/docker-deps-linux-amd64
            dist/docker-deps-darwin-amd64
            dist/docker-deps-darwin-arm64
            dist/docker-deps-windows-amd64.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  plugin:
    name: Build & Push Plugin
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Build plugin binary
        run: go build -o plugin/rootfs/docker-deps

      - name: Update plugin version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" plugin/config.json

      - name: Create Docker plugin
        run: docker plugin create ${{ env.PLUGIN_NAME }}:${GITHUB_REF#refs/tags/v} plugin

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push plugin to Docker Hub
        run: |
          docker plugin push docker.io/${{ env.PLUGIN_NAME }}:${GITHUB_REF#refs/tags/v}
          docker plugin push docker.io/${{ env.PLUGIN_NAME }}:latest
