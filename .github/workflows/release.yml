name: Release

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PLUGIN_NAME: filoucrackeur/docker-deps

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Build Binaries
        run: |
          mkdir dist
          GOOS=linux GOARCH=amd64 go build -o dist/docker-deps-linux-amd64
          GOOS=darwin GOARCH=amd64 go build -o dist/docker-deps-darwin-amd64
          GOOS=darwin GOARCH=arm64 go build -o dist/docker-deps-darwin-arm64
          GOOS=windows GOARCH=amd64 go build -o dist/docker-deps-windows-amd64.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/docker-deps-linux-amd64
            dist/docker-deps-darwin-amd64
            dist/docker-deps-darwin-arm64
            dist/docker-deps-windows-amd64.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  plugin:
    name: Build & Push Plugin
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Build plugin binary
        run: go build -o plugin/rootfs/docker-deps

      - name: Update plugin version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" plugin/config.json

      - name: Create Docker plugin
        run: |
          docker plugin disable -f docker.io/${{ env.PLUGIN_NAME }}:${GITHUB_REF#refs/tags/v} 2>/dev/null || true
          docker plugin rm -f docker.io/${{ env.PLUGIN_NAME }}:${GITHUB_REF#refs/tags/v} 2>/dev/null || true
          docker plugin create docker.io/${{ env.PLUGIN_NAME }}:${GITHUB_REF#refs/tags/v} plugin

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push plugin to Docker Hub
        run: |
          PLUGIN_TAG=${GITHUB_REF#refs/tags/v}
          docker plugin create docker.io/${{ env.PLUGIN_NAME }}:$PLUGIN_TAG plugin
          docker plugin push docker.io/${{ env.PLUGIN_NAME }}:$PLUGIN_TAG
          docker plugin rm docker.io/${{ env.PLUGIN_NAME }}:$PLUGIN_TAG 2>/dev/null || true

      - name: Update Docker Hub repository details
        run: |
          curl -X PATCH \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.DOCKERHUB_TOKEN }}" \
            -d '{"description": "A Docker CLI plugin for managing project dependencies. Think npm, composer, or pip - but for Docker images.", "full_description": "# Docker Deps\n\nA Docker CLI plugin for managing project dependencies.\n\n## Features\n- Manage project dependencies with a manifest file\n- CLI commands: add, remove, update, list, info, why, install\n- Bulk install: Pull all dependencies at once\n- Docker native: Integrated as a first-class Docker CLI plugin\n\n## Installation\n\n```bash\ndocker plugin install filoucrackeur/docker-deps\n```\n\n## Usage\n\n```bash\n# Initialize a project\ndocker deps init my-project 1.0.0\n\n# Add dependencies\ndocker deps add redis 7.2.0\n\n# Install all dependencies\ndocker deps install\n\n# List dependencies\ndocker deps list\n```", "category_type": 2}' \
            https://hub.docker.com/v2/repositories/${{ env.PLUGIN_NAME }}/
