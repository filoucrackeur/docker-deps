name: Release

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PLUGIN_NAME: filoucrackeur/docker-deps

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Build Binaries
        run: |
          mkdir dist
          GOOS=linux GOARCH=amd64 go build -o dist/docker-deps-linux-amd64
          GOOS=darwin GOARCH=amd64 go build -o dist/docker-deps-darwin-amd64
          GOOS=darwin GOARCH=arm64 go build -o dist/docker-deps-darwin-arm64
          GOOS=windows GOARCH=amd64 go build -o dist/docker-deps-windows-amd64.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/docker-deps-linux-amd64
            dist/docker-deps-darwin-amd64
            dist/docker-deps-darwin-arm64
            dist/docker-deps-windows-amd64.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  plugin:
    name: Build & Push Plugin
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Build plugin binary
        run: go build -o plugin/rootfs/docker-deps

      - name: Update plugin version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" plugin/config.json

      - name: Remove existing plugins
        run: |
          docker plugin list -q | xargs -r docker plugin disable -f 2>/dev/null || true
          docker plugin list -q | xargs -r docker plugin rm -f 2>/dev/null || true

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push Docker plugin
        run: |
          PLUGIN_TAG=${GITHUB_REF#refs/tags/v}
          docker plugin create docker.io/${{ env.PLUGIN_NAME }}:$PLUGIN_TAG plugin || true
          docker plugin push docker.io/${{ env.PLUGIN_NAME }}:$PLUGIN_TAG
          docker plugin create docker.io/${{ env.PLUGIN_NAME }}:latest plugin || true
          docker plugin push docker.io/${{ env.PLUGIN_NAME }}:latest

      - name: Update Docker Hub repository details
        run: |
          curl -X PATCH \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.DOCKERHUB_TOKEN }}" \
            -d '{"description": "A Docker CLI plugin for managing project dependencies", "category_type": 2}' \
            https://hub.docker.com/v2/repositories/${{ env.PLUGIN_NAME }}/
